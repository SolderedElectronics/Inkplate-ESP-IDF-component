name: Upload Component to Registry

on:
  push:
    tags:
      - 'v*'

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Upload component to ESP Registry
        uses: espressif/upload-components-ci-action@v2
        env:
          IDF_COMPONENT_VERSION_PROCESS_TIMEOUT: "1800"
        with:
          components: "inkplate: components/inkplate"
          namespace: solderedelectronics
