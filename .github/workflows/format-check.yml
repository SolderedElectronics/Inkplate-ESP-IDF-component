name: Format Check

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==22.1.4

      - name: Apply formatting
        run: |
          find components/inkplate/src components/inkplate/include \
               \( -name "*.cpp" -o -name "*.h" -o -name "*.c" \) \
               ! -path "*/pngle/*" \
               -print0 | xargs -0 clang-format -i

      - name: Check for differences
        run: |
          git diff --exit-code || (
            echo ""
            echo "The following files need formatting:"
            git diff --name-only
            exit 1
          )
