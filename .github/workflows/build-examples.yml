name: Build Examples

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    name: ${{ matrix.board.name }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: inkplate2
            config: INKPLATE2
            target: esp32
          - name: inkplate4
            config: INKPLATE4
            target: esp32
          - name: inkplate5
            config: INKPLATE5
            target: esp32
          - name: inkplate6
            config: INKPLATE6
            target: esp32
          - name: inkplate6color
            config: INKPLATE6COLOR
            target: esp32
          - name: inkplate6flick
            config: INKPLATE6FLICK
            target: esp32
          - name: inkplate10
            config: INKPLATE10
            target: esp32
          - name: inkplate13
            config: INKPLATE13
            target: esp32s3

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.board.name }} examples
        shell: bash
        run: |
          . $IDF_PATH/export.sh

          BOARD_CONFIG="CONFIG_INKPLATE_BOARD_${{ matrix.board.config }}=y"
          TARGET="${{ matrix.board.target }}"
          PROJ_DIR="/tmp/ci_project"

          # ── Create a single reusable project ────────────────────────────────
          mkdir -p "$PROJ_DIR/main"

          # Point EXTRA_COMPONENT_DIRS at components/ so ESP-IDF finds inkplate without
          # scanning the repo root CMakeLists.txt (which is a project file, not a component)
          cat > "$PROJ_DIR/CMakeLists.txt" << EOF
          cmake_minimum_required(VERSION 3.16)
          set(EXTRA_COMPONENT_DIRS "$GITHUB_WORKSPACE/components")
          include(\$ENV{IDF_PATH}/tools/cmake/project.cmake)
          project(inkplate_ci)
          EOF

          # Placeholder CMakeLists for the initial warm-up build below only —
          # each example's own main/CMakeLists.txt (with its correct SRCS/
          # REQUIRES) replaces this once the per-example loop starts.
          cat > "$PROJ_DIR/main/CMakeLists.txt" << 'EOF'
          idf_component_register(SRCS "main.cpp"
                                 REQUIRES "inkplate" "esp_wifi" "esp_http_server"
                                 INCLUDE_DIRS ".")
          EOF

          # sdkconfig.defaults: repo defaults + board selection
          cp "$GITHUB_WORKSPACE/sdkconfig.defaults" "$PROJ_DIR/sdkconfig.defaults"
          echo "$BOARD_CONFIG" >> "$PROJ_DIR/sdkconfig.defaults"

          # Minimal stub so the initial build has something to compile
          echo 'extern "C" void app_main() {}' > "$PROJ_DIR/main/main.cpp"

          # ── Initial full build — compiles the inkplate component once ────────
          echo "::group::initial build (${{ matrix.board.name }})"
          cd "$PROJ_DIR"
          idf.py set-target "$TARGET"
          idf.py build
          echo "::endgroup::"

          # ── Incremental builds — each example's whole main/ dir is swapped in ─
          FAIL=0
          FAILED_EXAMPLES=()

          while IFS= read -r main_cpp; do
            example_main_dir="$(dirname "$main_cpp")"
            example_dir="$(dirname "$example_main_dir")"

            echo "::group::$(basename "$example_dir")"
            echo "Building: $example_dir"

            # Replace main/ wholesale with the example's own main/ directory,
            # including its own CMakeLists.txt (correct SRCS/REQUIRES for
            # that example) and any subdirectories (fonts, icons, etc.) —
            # a flat, single-file copy misses multi-source-file examples.
            rm -rf "$PROJ_DIR/main"
            cp -r "$example_main_dir" "$PROJ_DIR/main"

            if (cd "$PROJ_DIR" && idf.py build); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Failed to build $example_dir"
              FAILED_EXAMPLES+=("$example_dir")
              FAIL=1
            fi

          done < <(find "$GITHUB_WORKSPACE/components/inkplate/examples/${{ matrix.board.name }}" \
                        -path "*/main/main.cpp" | sort)

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Failed examples:"
            printf '  - %s\n' "${FAILED_EXAMPLES[@]}"
            exit 1
          fi
